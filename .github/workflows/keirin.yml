name: keirin-daily
# 競輪 仮想試験（実投票なし）。1日を3回のジョブ（各5時間45分まで）でつなぐ。
# データベースはリリース "db" に keirin.sqlite.gz として保存し、毎回ダウンロード→更新→アップロードする。
on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 JST
    - cron: "45 3 * * *"   # 12:45 JST
    - cron: "30 9 * * *"   # 18:30 JST（日付をまたいで最終レースの結果まで）
  workflow_dispatch:
    inputs:
      mode:
        description: "run=通常実行 / test=接続テストのみ（DBは更新しない）"
        default: "test"
        type: choice
        options: [test, run]
      max_sec:
        description: "当日ループの実行秒数（試験用。通常は19800=5時間30分）"
        default: "19800"

concurrency:
  group: keirin
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Tokyo
  PYTHONIOENCODING: utf-8
  GH_TOKEN: ${{ github.token }}
  KEIRIN_DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/requirements.txt
      - run: pip install -q -r deploy/requirements.txt

      - name: 接続テスト
        run: |
          for u in "https://www.winticket.jp/keirin/racecard/" "https://keirin.netkeiba.com/race/race_list/"; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' "$u")"
          done
          python - <<'PY'
          import kr, os, tempfile
          kr.BASE = tempfile.mkdtemp()
          con = kr.db()
          res = kr.fetch_daily(con)
          print("開催一覧の取得テスト (開催数, レース数):", res)
          import notify
          notify.discord(f"【接続テスト】GitHub から競輪サイトに接続できました。本日 {res[0]}開催・{res[1]}レース")
          PY

      - name: データベースを取得
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        run: |
          gh release download db -p keirin.sqlite.gz --clobber && gunzip -f keirin.sqlite.gz || echo "DBなし（新規作成）"
          ls -la keirin.sqlite || true

      - name: 前日分の結果を補完（取りこぼした分だけ取得するので、毎回実行しても数秒で終わる）
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        run: python -c "import backfill,datetime as d;y=(d.date.today()-d.timedelta(1)).strftime('%Y%m%d');backfill.main(y,y)"

      - name: 前日分のレース後インタビューを補完（当日ループで取れなかった分だけ。失敗しても先へ進む）
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        continue-on-error: true
        timeout-minutes: 15
        run: python -c "import backfill_interviews as bi,datetime as d;y=(d.date.today()-d.timedelta(1)).strftime('%Y%m%d');bi.main(y,y,kind='after')"

      - name: 当日ループ
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        env:
          KEIRIN_MAX_SEC: ${{ inputs.max_sec || '19800' }}   # 5時間30分で区切って次のジョブへ引き継ぐ
        run: python run_day.py

      - name: データベースとレポートを保存
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'run')
        run: |
          python export.py || true
          python score_track.py || true   # 点数方式・3番手絡みの追跡（記録には触らない）
          gzip -kf keirin.sqlite
          gh release upload db keirin.sqlite.gz --clobber
          # その日の一覧（レース・選手・全オッズ）ができていれば、リリース "tables" に置いて Discord に知らせる
          if ls out/tables/*.csv >/dev/null 2>&1; then
            gh release view tables >/dev/null 2>&1 || gh release create tables --title "毎日の一覧（レース・選手・全オッズ）" --notes "1日ごとのCSV。Excelで開けます。"
            gh release upload tables out/tables/*.csv --clobber
            days=$(ls out/tables/races_*.csv | sed 's/.*races_//; s/.csv//' | paste -sd ' ')
            python notify_tables.py "$days" "https://github.com/${{ github.repository }}/releases/tag/tables"
          fi
          mkdir -p reports && cp out/*.md reports/ 2>/dev/null || true
          git config user.name "keirin-bot"
          git config user.email "keirin-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || (git commit -q -m "reports $(date '+%F %H:%M')" && (git pull -q --rebase origin main && git push -q || echo "レポートの書き込みは次回に回します"))

      - name: 次の回を予約（時刻指定の起動が遅れたり飛ばされたりしても途切れないように）
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'run')
        run: |
          # 実行中・待機中の回がなければ、次の回を起動する（同時実行は concurrency で1つに制限）
          n=$(gh run list --workflow keirin.yml --status queued --json databaseId --jq 'length')
          if [ "$n" = "0" ]; then
            gh workflow run keirin.yml -f mode=run -f max_sec=19800
            echo "次の回を予約しました"
          else
            echo "待機中の回があるため予約しません"
          fi
